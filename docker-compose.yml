version: '3.8'

services:
  interviewee_app:
    build:
      context: ./interviewee_side
      dockerfile: Dockerfile
    image: arkumar249/interviewee_app:latest
    environment:
      # Passes the Host machines X-Server display coordinate to the container so GUI can launch
      - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
      # Maps the internal python code to target this folder
      - USER_DATA_DIR=/app/user_data
    volumes:
      # Mounts the X11 server socket for GUI capabilities
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Synchronizes all Interviewee output into the local 'shared_user_data' folder
      - ./shared_user_data:/app/user_data
    devices:
      # Optional: Maps physical webcams into the container (primarily on Linux)
      - /dev/video0:/dev/video0 

  interviewer_app:
    build:
      context: ./interviewer_side/AIHiringAssistant
      dockerfile: Dockerfile
    image: arkumar249/interviewer_app:latest
    environment:
      - DISPLAY=${DISPLAY}
      - QT_QPA_PLATFORM=xcb
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Synchronizes with the exact same 'shared_user_data' folder so the Interviewer immediately sees output
      - ./shared_user_data:/app/user_data
